name: Build unsigned Nelly IPA

on:
  workflow_dispatch:
  push:
    branches: [main, build/nelly-ios-app]
    paths:
      - "Sources/**"
      - "project.yml"
      - "Assets.xcassets/**"
      - "scripts/**"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen and Pillow
        run: |
          brew install xcodegen
          python3 -m pip install --user pillow
      - name: Generate butterfly app icon
        run: python3 scripts/generate_icon.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Nelly.xcodeproj -scheme Nelly -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Nelly.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Nelly.app
          cd build
          zip -r Nelly-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nelly-unsigned-IPA
          path: build/Nelly-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
